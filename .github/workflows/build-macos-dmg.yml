# Fabrication automatique du DMG macOS d'Ortho4XP V3 par GitHub.
# AUTOMATIQUE : à chaque « Push origin » sur la branche officielle
# ORTHO4XP_V3, GitHub refabrique le DMG et REMPLACE le fichier
# ORTHO4XP_V3_Mac.dmg de la dernière Release publiée.
# Roland n'a RIEN à faire. (Manuel possible : Actions → Run workflow)
# ============================================================
name: Fabriquer le DMG macOS

on:
  # Automatique : chaque « Push origin » sur la branche officielle
  push:
    branches: [ORTHO4XP_V3]
  # Manuel : onglet Actions → « Run workflow »
  workflow_dispatch:

# Deux envois rapprochés : seul le dernier fabrique le DMG
concurrency:
  group: dmg-macos
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-14
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Python 3.12 + Pillow (icône)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pillow

      - name: Préparer le contenu du DMG
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/stage"
          APP="$STAGE/ORTHO4XP_V3"
          mkdir -p "$APP"
          # Copie du dépôt SANS : git, recette, caches, anciens lanceurs, sauvegardes « copie »
          rsync -a \
            --exclude ".git/" --exclude ".github/" \
            --exclude "__pycache__/" --exclude "*.pyc" --exclude ".DS_Store" \
            --exclude "venv/" --exclude "dist/" \
            --exclude "Lanceur_Installation_Prerequis.app/" \
            --exclude "*copie*" \
            ./ "$APP/"
          test -f "$APP/INSTALL_PREREQUIS.py"
          test -f "$APP/create_launcher_prerequis.py"
          echo "Fichiers src/ : $(ls "$APP/src"/O4_*.py | wc -l)"

      - name: Fabriquer le lanceur (binaire universel Intel + Apple Silicon)
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/stage/ORTHO4XP_V3"
          cd "$APP"
          python create_launcher_prerequis.py
          L="$APP/Lanceur_Installation_Prerequis.app"
          test -x
